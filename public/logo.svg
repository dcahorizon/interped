<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 65" width="100%" height="100%">
  <style>
    .inter { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; font-size: 34px; fill: #0b1c3c; }
    .ped { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; font-size: 34px; fill: #00c853; }
    .slogan { font-family: 'Arial', sans-serif; font-style: italic; font-size: 12px; fill: #475569; font-weight: bold; }
  </style>
  
  <!-- Texto Principal: INTERPED -->
  <text x="0" y="30">
    <tspan class="inter">INTER</tspan>
    <tspan class="ped">PED</tspan>
  </text>
  
  <!-- Línea decorativa verde -->
  <rect x="0" y="38" width="215" height="3" fill="#00c853" rx="1" />
  
  <!-- Frase debajo (adaptada en tono oscuro para fondos claros) -->
  <text x="0" y="54" class="slogan">La conexión más rápida al mundo</text>
</svg>
