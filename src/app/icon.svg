<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo con esquinas redondeadas estilo app moderna -->
  <rect width="64" height="64" rx="14" fill="#0b1c3c"/>
  
  <!-- Iniciales IP (I en blanco, P en verde brillante) -->
